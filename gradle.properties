org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 项目已迁到 ASCII 路径 C:\pvz2auto，不再需要 android.overridePathCheck。
#
# 历史：之前项目叫「pvz安卓自动化」，AGP 会拒绝含非 ASCII 字符的路径。当时加了
# android.overridePathCheck=true 试探，结论是：
#   · assembleDebug 能过（编译链没问题）
#   · 但 testDebugUnitTest 会 ClassNotFoundException —— JVM 测试进程加载不到
#     明明存在于 build/tmp/kotlin-classes/ 下的测试类
# 也就是说那个开关只放行了编译，没放行工具链。所以最终选择搬到 ASCII 路径，
# 而不是长期靠这个开关。别再加回来。

kotlin.code.style=official
