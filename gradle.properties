org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The project directory is named "pvz安卓自动化" (non-ASCII). AGP refuses such paths by
# default with "Your project path contains non-ASCII characters". This flag disables the
# check. It is currently here as an EXPERIMENT to find out whether the Chinese path
# actually breaks anything on this machine, or whether the check is merely conservative.
# If anything downstream misbehaves (aapt2, NDK, OpenCV native extraction), move the
# project to an ASCII path instead - that is the robust fix.
android.overridePathCheck=true

kotlin.code.style=official
